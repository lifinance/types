name: Verify Pull Request

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-install
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm exec eslint src tests
