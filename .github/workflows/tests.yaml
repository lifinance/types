name: Tests

on:
  # publish.yaml calls this workflow as its Verify gate before Version and Release.
  workflow_call:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cache: 'true' # read-only job
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  version-guard:
    # Versions change only in the Changesets Version PR (branch changeset-release/main of
    # this repository; a fork cannot claim that name). Never runs in publish.yaml's verify
    # gate (workflow_call from a push).
    if: >-
      github.event_name == 'pull_request'
      && !(github.head_ref == 'changeset-release/main'
      && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # public repo: the fetch below needs no token
      - name: package.json version must not change outside the Version PR
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          bash .github/scripts/version-guard.sh FETCH_HEAD
