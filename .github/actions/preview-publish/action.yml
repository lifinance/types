name: Preview publish
description: >-
  Snapshot-publish this package to the npm `preview` dist-tag, comment the
  install command on the PR, and remove the `release-preview` label.

runs:
  using: composite
  steps:
    # Only changesets that this PR adds count. Changesets that are already on the base
    # branch (merged, not versioned yet) do not make an unchanged PR worth a preview.
    # `changeset version` also exits 1 when there are no changesets (Changesets v3).
    - name: Check for changesets in this PR
      id: changesets
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        git fetch --quiet --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
        added=$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" -- '.changeset/*.md' | grep -v '/README\.md$' || true)
        if [ -n "$added" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "Changesets added by this PR:"; echo "$added"
        else
          echo "::warning::This PR adds no changeset — nothing to publish as a preview."
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Version the package as a preview snapshot
      if: steps.changesets.outputs.present == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }} # changeset version hits the GitHub API (changelog-github)
      run: |
        # snapshot tag = short SHA → version 0.0.0-preview-<sha> (prereleaseTemplate "{tag}")
        SHA=$(git rev-parse --short HEAD)
        pnpm changeset version --snapshot "preview-$SHA"

    # Skipped when no changeset is present: `publish` is then empty, so every
    # downstream step below skips too.
    - name: Detect the preview version
      id: detect
      if: steps.changesets.outputs.present == 'true'
      shell: bash
      run: |
        jq -r 'select(.version | test("-preview-")) | "\(.name)@\(.version)"' package.json > "$RUNNER_TEMP/preview-pkgs.txt"
        pkg=$(cat "$RUNNER_TEMP/preview-pkgs.txt")
        if [ -z "$pkg" ]; then
          echo "::warning::The changesets do not bump this package — nothing to publish as a preview."
          echo "publish=false" >> "$GITHUB_OUTPUT"
        elif npm view "$pkg" version >/dev/null 2>&1; then
          # Same head commit as an earlier preview (for example the label was re-added).
          echo "::warning::$pkg is already on npm — push a new commit for a new preview."
          echo "publish=false" >> "$GITHUB_OUTPUT"
        else
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Preview version to publish: $pkg"
        fi

    # Same script as the real release (build + changeset publish), with the preview tag.
    - name: Build and publish the preview to npm
      if: steps.detect.outputs.publish == 'true'
      shell: bash
      run: pnpm changeset:publish --tag preview --no-git-tag
      env:
        NPM_CONFIG_PROVENANCE: true

    - name: Comment the install command on the PR
      if: steps.detect.outputs.publish == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        {
          echo "📦 **Preview published** under the \`preview\` dist-tag."
          echo
          echo "Install the exact version — \`@preview\` moves with the newest preview across PRs:"
          echo
          echo '```bash'
          while IFS= read -r pkg; do echo "npm i $pkg"; done < "$RUNNER_TEMP/preview-pkgs.txt"
          echo '```'
        } > "$RUNNER_TEMP/preview-comment.md"
        gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/preview-comment.md"

    # success only: a failed run keeps the label as a signal (remove + re-add to retry)
    - name: Remove the release-preview label (one-shot)
      if: success()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh pr edit "${{ github.event.pull_request.number }}" --remove-label release-preview || true
