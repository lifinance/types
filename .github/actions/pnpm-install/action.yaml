name: 'PNPM install'
description: 'Run pnpm install (pnpm store cache off unless the job opts in)'

inputs:
  cache:
    description: >-
      Use the pnpm store cache. Off by default so privileged jobs (publish / version
      PR / preview) never restore a poisoned cache; read-only jobs opt in with 'true'.
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        registry-url: 'https://registry.npmjs.org'
        # '' disables caching entirely (no restore, no save) for privileged jobs.
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
    - name: Install dependencies
      env:
        HUSKY: '0' # By default do not run HUSKY install
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
